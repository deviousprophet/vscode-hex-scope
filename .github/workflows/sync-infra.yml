name: Sync CI Infrastructure

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download infra workflows
        run: |
          BASE="https://raw.githubusercontent.com/deviousprophet/vscode-ci-infra/main"
          mkdir -p .github/workflows .github/scripts
          for f in ct.yml package.yml release.yml fallow.yml ci.yml; do
            curl -sSfL "$BASE/.github/workflows/$f" -o ".github/workflows/$f"
          done
          for f in summarize-tests.mjs extract-release-notes.mjs; do
            curl -sSfL "$BASE/.github/scripts/$f" -o ".github/scripts/$f"
          done

      - name: Download agent skills (non-Trellis only; Trellis skills managed by Trellis itself)
        run: |
          BASE="https://raw.githubusercontent.com/deviousprophet/vscode-ci-infra/v0.0.1"
          MANIFEST=$(curl -sSL "$BASE/agents/skills/MANIFEST.txt")
          echo "$MANIFEST" | while read skill; do
            [ -z "$skill" ] && continue
            mkdir -p ".agents/skills/$skill"
            curl -sSfL "$BASE/agents/skills/$skill/SKILL.md" -o ".agents/skills/$skill/SKILL.md" || true
          done

      - name: Validate YAML
        run: |
          for f in .github/workflows/*.yml; do
            node -e "
              const y = require('js-yaml');
              try { y.load(require('fs').readFileSync('$f','utf8')); }
              catch(e) { console.error('$f: ' + e.message); process.exit(1); }
            " 2>&1 || exit 1
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: sync CI infra from vscode-ci-infra"
          title: "chore: sync CI infrastructure from vscode-ci-infra"
          body: |
            Automated sync from [vscode-ci-infra](https://github.com/deviousprophet/vscode-ci-infra).

            Review changes before merging.
          branch: chore/sync-ci-infra
          delete-branch: true
