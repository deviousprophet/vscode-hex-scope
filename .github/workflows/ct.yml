name: CT Workflow

env:
  NODE_VERSION: '24'

on:
  workflow_call:

jobs:
  UT_Test:
    name: Unit Test Execution
    runs-on: ubuntu-latest
    outputs:
      run-tests-outcome: ${{ steps.run-tests.outcome }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Tests
        run: npm run compile-tests

      - name: Compile Extension
        run: npm run compile

      - name: Run Tests
        id: run-tests
        run: |
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee unit-test-output.log

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: unit-test-output.log
          name: unit-test-output-${{ github.sha }}
          overwrite: true

  E2E_Test:
    name: E2E Test Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache ExTester Resources
        uses: actions/cache@v4
        with:
          path: ./test-resources
          key: extest-1.125.0-${{ runner.os }}

      - name: Install Dependencies
        run: npm ci

      - name: Compile Tests
        run: npm run compile-tests

      - name: Compile Extension
        run: npm run compile

      - name: Run E2E Tests
        id: run-e2e
        run: |
          set -o pipefail
          xvfb-run -a npm run test:e2e 2>&1 | tee e2e-test-output.log

      - name: Upload E2E Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: e2e-test-output.log
          name: e2e-test-output-${{ github.sha }}
          overwrite: true

  Benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run All Benchmarks
        id: run-benchmarks
        run: |
          set -o pipefail
          npm run benchmark -- --continue 2>&1 | tee benchmark-output.log

      - name: Upload Benchmark Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: benchmark-output.log
          name: benchmark-output-${{ github.sha }}
          overwrite: true

  Finalize:
    name: Finalize Workflow
    needs: [UT_Test, E2E_Test, Benchmarks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Job Results
        run: |
          UT_RESULT="${{ needs.UT_Test.result }}"
          E2E_RESULT="${{ needs.E2E_Test.result }}"
          BENCHMARK_RESULT="${{ needs.Benchmarks.result }}"
          FAILED=false
          if [[ "$UT_RESULT" != "success" ]]; then
            echo "[FAIL] Unit Test job: $UT_RESULT"
            FAILED=true
          else
            echo "[OK] Unit Test job: $UT_RESULT"
          fi
          if [[ "$E2E_RESULT" != "success" ]]; then
            echo "[FAIL] E2E Test job: $E2E_RESULT"
            FAILED=true
          else
            echo "[OK] E2E Test job: $E2E_RESULT"
          fi
          if [[ "$BENCHMARK_RESULT" != "success" ]]; then
            echo "[FAIL] Benchmarks job: $BENCHMARK_RESULT"
            FAILED=true
          else
            echo "[OK] Benchmarks job: $BENCHMARK_RESULT"
          fi
          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi

      - name: Download UT Test Log
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: unit-test-output-${{ github.sha }}
          path: .

      - name: Download E2E Test Log
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-output-${{ github.sha }}
          path: .

      - name: Download Benchmark Log
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: benchmark-output-${{ github.sha }}
          path: .

      - name: Unit Test Summary
        if: always()
        env:
          RUN_TESTS_OUTCOME: ${{ needs.UT_Test.outputs.run-tests-outcome }}
          LOG_FILE: unit-test-output.log
          SUITE_NAME: Unit Test Results
        run: node .github/scripts/summarize-tests.mjs

      - name: E2E Test Summary
        if: always()
        env:
          RUN_TESTS_OUTCOME: ${{ needs.E2E_Test.outputs.run-e2e-outcome }}
          LOG_FILE: e2e-test-output.log
          SUITE_NAME: E2E Test Results
        run: node .github/scripts/summarize-tests.mjs

      - name: Benchmark Summary
        if: always()
        env:
          RUN_TESTS_OUTCOME: ${{ needs.Benchmarks.result }}
          LOG_FILE: benchmark-output.log
          SUITE_NAME: Benchmark
        run: node .github/scripts/summarize-tests.mjs

      - name: Benchmark Summary
        if: always()
        env:
          RUN_TESTS_OUTCOME: ${{ needs.Benchmarks.result }}
          LOG_FILE: benchmark-output.log
          SUITE_NAME: Benchmark
        run: node .github/scripts/summarize-tests.mjs
