name: CT Workflow

env:
  NODE_VERSION: '26'
  RUST_TOOLCHAIN: '1.97.1'

on:
  workflow_call:

jobs:
  UT_Test:
    name: Unit Test Execution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    outputs:
      run-tests-outcome: ${{ steps.run-tests.outcome }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-workspaces: rust

      - name: Install Dependencies
        run: npm ci

      - name: Check Rust Formatting
        run: npm run rust:fmt

      - name: Lint Rust
        run: npm run rust:clippy

      - name: Test Rust Core
        run: npm run rust:test

      - name: Compile Tests
        run: npm run compile-tests

      - name: Compile Extension
        run: npm run compile

      - name: Engine Smoke Test
        run: npm run engine:smoke

      - name: Run Tests
        id: run-tests
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm test 2>&1 | tee unit-test-output.log
          else
            npm test 2>&1 | tee unit-test-output.log
          fi

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: unit-test-output.log
          name: unit-test-output-${{ matrix.os }}
          overwrite: true

  Benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run All Benchmarks
        id: run-benchmarks
        run: |
          set -o pipefail
          npm run benchmark -- --continue 2>&1 | tee benchmark-output.log

      - name: Upload Benchmark Results Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: benchmark-output.log
          name: benchmark-output-${{ github.sha }}
          overwrite: true

  Finalize:
    name: Finalize Workflow
    needs: [UT_Test, Benchmarks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Job Results
        run: |
          UT_RESULT="${{ needs.UT_Test.result }}"
          BENCHMARK_RESULT="${{ needs.Benchmarks.result }}"
          FAILED=false
          if [[ "$UT_RESULT" != "success" ]]; then
            echo "❌ Unit Test job: $UT_RESULT"
            FAILED=true
          else
            echo "✅ Unit Test job: $UT_RESULT"
          fi
          if [[ "$BENCHMARK_RESULT" != "success" ]]; then
            echo "❌ Benchmarks job: $BENCHMARK_RESULT"
            FAILED=true
          else
            echo "✅ Benchmarks job: $BENCHMARK_RESULT"
          fi
          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi

      - name: Download UT Test Logs
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: unit-test-output-*
          path: ut-logs

      - name: Merge UT Test Logs
        if: always()
        run: |
          : > unit-test-output.log
          for log in ut-logs/*/unit-test-output.log; do
            [ -f "$log" ] || continue
            echo "### $log" >> unit-test-output.log
            cat "$log" >> unit-test-output.log
          done

      - name: Download Benchmark Log
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: benchmark-output-${{ github.sha }}
          path: .

      - name: Unit Test Summary
        if: always()
        env:
          RUN_TESTS_OUTCOME: ${{ needs.UT_Test.outputs.run-tests-outcome }}
          LOG_FILE: unit-test-output.log
          SUITE_NAME: Unit Test Results
        run: node .github/scripts/summarize-tests.mjs

      - name: Benchmark Summary
        if: always()
        env:
          RUN_TESTS_OUTCOME: ${{ needs.Benchmarks.result }}
          LOG_FILE: benchmark-output.log
          SUITE_NAME: Benchmark
        run: node .github/scripts/summarize-tests.mjs
