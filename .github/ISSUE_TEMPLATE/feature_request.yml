name: Feature request
description: Suggest an idea or an improvement for Hex Scope
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please [search existing issues](https://github.com/deviousprophet/vscode-hex-scope/issues?q=is%3Aissue) and check the [README](https://github.com/deviousprophet/vscode-hex-scope#readme) first.
        Describing the problem you're trying to solve helps more than describing a specific implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what gets in your way today?
      placeholder: "When I'm reviewing a firmware image, I often need to ... but currently I have to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Hex Scope to do? Workarounds or alternatives you've tried are welcome too.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Hex Scope would this touch?
      options:
        - File formats / parsing
        - Memory view
        - Records view
        - Search
        - Inspector
        - Type Overlay
        - Integrity checks / stored values
        - Editing / Save
        - Copy & export
        - Segment labels
        - Profiles / .hexscope storage
        - Scripting
        - Toolbar / sidebar / UI
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Examples or references (optional)
      description: |
        Sketches, screenshots, sample data, or standards references (e.g. a CRC variant with polynomial and init values). Note any file-format specifics here too.
        **Do not share proprietary firmware.**
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to help implement this?
      options:
        - "No, I'm just suggesting"
        - "Maybe, with some guidance"
        - "Yes, I'd open a pull request"
    validations:
      required: false
