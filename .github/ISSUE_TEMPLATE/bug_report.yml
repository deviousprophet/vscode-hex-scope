name: Bug report
description: Something in Hex Scope is broken or behaves incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please [search existing issues](https://github.com/deviousprophet/vscode-hex-scope/issues?q=is%3Aissue) first.
        A minimal sample file and clear reproduction steps make bugs much faster to fix. **Do not share proprietary firmware.**

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, what actually happened, and any error message.
      placeholder: |
        I expected ...
        Instead ...
        Error: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click `firmware.hex` -> Open with HexScope Viewer
        2. Switch to the Memory view
        3. Press Ctrl+F and search for ...
        4. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Hex Scope is affected?
      options:
        - File loading / parsing
        - Memory view
        - Records view
        - Search
        - Inspector
        - Type Overlay
        - Integrity checks / stored values / auto fix
        - Editing / Save
        - Quick Repair Checksums
        - Copy & export
        - Segment labels
        - Profiles / .hexscope storage
        - Scripting
        - Toolbar / sidebar / UI layout
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Hex Scope version (Extensions view), editor, and OS.
      placeholder: "Hex Scope 2.23.0 · VS Code 1.125.0 · Windows 11"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Sample file, logs, or screenshots (optional)
      description: |
        Drag a minimal `.hex` / `.srec` file here (rename to `.txt` if GitHub rejects the extension) or drop a screenshot, or paste the relevant records and errors inside a code fence.
        For UI problems, open the webview console with **Developer: Open Webview Developer Tools**; for extension errors use **Help -> Toggle Developer Tools -> Console**.
        For Type Overlay, Integrity, Profile, or Scripting bugs, include the relevant part of `.hexscope/types.json`, `.hexscope/profiles.json`, `.hexscope/bindings.json`, or the script from `.hexscope/scripts/`.
    validations:
      required: false
